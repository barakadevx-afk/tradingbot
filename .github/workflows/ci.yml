name: BARAKA AI CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Lint Python
        run: |
          cd backend
          flake8 app/ --max-line-length=120
          black app/ --check
      - name: Lint Frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python type check
        run: |
          cd backend
          pip install -r requirements.txt
          mypy app/ --ignore-missing-imports
      - name: Frontend type check
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baraka
          POSTGRES_PASSWORD: baraka_secret
          POSTGRES_DB: baraka_ai_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest tests/ -v --cov=app
      - name: Frontend tests
        run: |
          cd frontend
          npm ci
          npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t baraka-ai-backend ./backend
          docker build -t baraka-ai-frontend ./frontend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security scan
        run: |
          cd backend
          pip install bandit safety
          bandit -r app/
          safety check

  deploy:
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo 'Deploy to production server'
          echo 'WARNING: Never auto-deploy live-trading strategy changes'
